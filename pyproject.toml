[project]
name = "trace-kunden"
version = "0.1.0"
description = "Customer Analytics und Churn-Prognose auf Online Retail II (Portfolio-Projekt)"
authors = [
    { name = "endritde", email = "352179534+endritde@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.6",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
